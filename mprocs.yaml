procs:
  # Windows: mprocs spawns commands without a shell, so bare "npm" /
  # "inngest-cli" resolve to extensionless shims CreateProcessW can't run
  # (os error 193). Route every pane through cmd /c.
  ngrok:
    cmd: ["cmd", "/c", "npm", "run", "ngrok:dev"]

  inngest:
    cmd: ["cmd", "/c", "npm", "run", "inngest:dev"]

  next:
    cmd: ["cmd", "/c", "npm", "run", "dev"]
