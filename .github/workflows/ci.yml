name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: "1"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autoflow_test
      BETTER_AUTH_SECRET: ci-not-a-real-secret
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint (Biome)
        run: npm run lint
      - name: Dependency audit
        # AF-M8-08 took this from 39 findings (3 critical, 18 high) to 6 LOW.
        # Without a gate it silently rots back: an advisory published against
        # an already-installed version regresses the tree with no code change,
        # so nothing else in this pipeline would ever notice.
        #
        # HIGH+ only. `--audit-level=high` still REPORTS low and moderate
        # findings, it just does not fail on them - matching the bar security.md
        # states ("HIGH/CRITICAL blocks merge") rather than blocking every merge
        # on the 6 known LOW advisories in the @ai-sdk chain, whose only fix is
        # a major upgrade tracked as AF-M8-19.
        run: npm audit --audit-level=high
      - name: Unit tests
        run: npm test
      - name: Build
        # `next build` OOM'd on 1893abf at Node's ~2 GB default heap and then
        # passed on a straight re-run — it sits right at the ceiling since the
        # /costs page and recharts landed. Raising the heap removes the
        # coin-flip; it does not hide a regression, because a real memory leak
        # would still exhaust 4 GB.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build
