name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: "1"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autoflow_test
      BETTER_AUTH_SECRET: ci-not-a-real-secret
      # AF-M0-06: without this the `integration` project skips itself and CI
      # goes green having run none of it - the suites that prove cross-tenant
      # isolation, the public REST surface, and API-key auth. The service
      # container below is the only database in the job, so pointing the test
      # DB at it is safe: there is no dev or production data to truncate.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autoflow_test
      # ALLOW_LOOPBACK_EGRESS is deliberately NOT set here.
      #
      # The AF-M9-16 acceptance suite does need it: it drives real
      # HTTP_REQUEST nodes at a loopback fixture server, which the AF-M9-02
      # egress guard blocks by default. But `vitest.integration.setup.ts`
      # already sets it per worker, which is the only correct place for it.
      # `npm test` runs all three projects in one job, so a job-level value
      # reaches the unit project too, where two egress-guard tests assert that
      # loopback IS blocked. Setting it here made those two fail on every CI
      # run while every local run passed — a developer's `.env` does not set
      # the flag, so the difference was invisible outside CI.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24, matching the deployment target (Vercel's Node.js Version is
          # 24.x) and local development. CI on a different major than
          # production is how a runtime-only failure gets to stay invisible
          # here, which is exactly what happened with the AF-M10-12 renderer.
          # It also satisfies the `^20.19.0 || ^22.12.0 || >=24.0.0` that
          # `jsdom`, `html-encoding-sniffer` and `@exodus/bytes` declare.
          #
          # Node 20 additionally broke the audit step: the npm it ships POSTs
          # to `/-/npm/v1/security/audits/quick`, which the registry now
          # answers with 400 Bad Request — so the gate failed on an
          # infrastructure error while reporting 0 vulnerabilities in the same
          # run. Newer npm uses the bulk advisory endpoint.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint (Biome)
        run: npm run lint
      - name: Dependency audit
        # AF-M8-08 took this from 39 findings (3 critical, 18 high) to 6 LOW.
        # Without a gate it silently rots back: an advisory published against
        # an already-installed version regresses the tree with no code change,
        # so nothing else in this pipeline would ever notice.
        #
        # HIGH+ only, matching the bar security.md states ("HIGH/CRITICAL
        # blocks merge"). `--audit-level=high` still REPORTS low and moderate
        # findings, it just does not fail on them.
        #
        # The tree is currently clean at every severity - AF-M8-19 cleared the
        # last 6 LOW advisories in the @ai-sdk chain. The threshold stays at
        # HIGH because that is the documented policy, not because anything LOW
        # is outstanding; raising it to `low` is a policy change, not a fix.
        run: npm audit --audit-level=high
      - name: Tests (unit, dom, integration)
        # `npm test` is `vitest run`, which runs all three projects. The
        # integration project needs TEST_DATABASE_URL (set at the job level) or
        # every suite in it skips itself and this step passes having proven
        # nothing about the database-backed behaviour.
        run: npm test
      - name: Build
        # `next build` OOM'd on 1893abf at Node's ~2 GB default heap and then
        # passed on a straight re-run — it sits right at the ceiling since the
        # /costs page and recharts landed. Raising the heap removes the
        # coin-flip; it does not hide a regression, because a real memory leak
        # would still exhaust 4 GB.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build
